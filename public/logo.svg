<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clean Nordic Oat Background -->
  <rect width="500" height="500" fill="#FAF8F5"/>

  <!-- Minimal Circle Frame -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#231B17" stroke-width="1.2" opacity="0.15"/>

  <!-- SINGLE CONTINUOUS LINE YARN 'C' COCOON -->
  <g transform="translate(0, -15)">
    <!-- Continuous Single Thread Drawing Letter 'C' & Cocoon Nest -->
    <path d="M 330,150 
             C 310,110 240,110 190,140 
             C 140,170 140,240 180,280 
             C 220,320 300,320 330,280 
             C 340,265 330,240 310,240 
             C 270,240 250,280 210,260 
             C 180,245 180,185 220,165 
             C 260,145 300,180 330,170 
             C 340,165 345,155 330,150 
             Z" 
          fill="none" stroke="#231B17" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle Floating Stitch Loop at the End -->
    <circle cx="340" cy="155" r="5" fill="#C28768"/>
    <circle cx="250" cy="210" r="7" fill="#C28768"/>
  </g>

  <!-- Clean Scandinavian Typography -->
  <text x="250" y="380" text-anchor="middle" font-family="'Century Gothic', 'Futura', 'Nunito', sans-serif" font-size="44" font-weight="700" letter-spacing="0.35em" fill="#231B17">
    cocoon
  </text>
  <text x="250" y="410" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.45em" fill="#C28768">
    SLOW CRAFTED KNITWEAR
  </text>
</svg>
