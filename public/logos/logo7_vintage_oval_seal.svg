<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Antique Parchment Background -->
  <rect width="500" height="500" fill="#F8F3EA"/>

  <g transform="translate(0, -5)">
    <!-- Vintage Double Oval Seal -->
    <ellipse cx="250" cy="235" rx="175" ry="145" fill="none" stroke="#2A1E17" stroke-width="2.5"/>
    <ellipse cx="250" cy="235" rx="166" ry="136" fill="none" stroke="#2A1E17" stroke-width="1" stroke-dasharray="4,4"/>
    <ellipse cx="250" cy="235" rx="156" ry="126" fill="#FFFDF8" stroke="#2A1E17" stroke-width="1.8"/>

    <!-- Crossed Antique Crochet Hooks -->
    <line x1="180" y1="160" x2="320" y2="300" stroke="#8A5A36" stroke-width="5" stroke-linecap="round"/>
    <line x1="180" y1="160" x2="320" y2="300" stroke="#2A1E17" stroke-width="1.2" stroke-linecap="round"/>
    
    <line x1="320" y1="160" x2="180" y2="300" stroke="#8A5A36" stroke-width="5" stroke-linecap="round"/>
    <line x1="320" y1="160" x2="180" y2="300" stroke="#2A1E17" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Central Vintage Lettermark 'C' -->
    <text x="250" y="260" text-anchor="middle" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="95" font-weight="700" font-style="italic" fill="#2A1E17">
      C
    </text>

    <!-- Top & Bottom Curved Botanical Sprigs -->
    <path d="M 210,135 Q 250,122 290,135" fill="none" stroke="#68846C" stroke-width="2" stroke-linecap="round"/>
    <circle cx="250" cy="126" r="3.5" fill="#C47355"/>

    <path d="M 210,335 Q 250,348 290,335" fill="none" stroke="#68846C" stroke-width="2" stroke-linecap="round"/>
    <circle cx="250" cy="344" r="3.5" fill="#C47355"/>
  </g>

  <!-- Typography -->
  <text x="250" y="415" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="38" font-weight="700" letter-spacing="0.32em" fill="#2A1E17">
    COCOON
  </text>
  <text x="250" y="442" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.42em" fill="#8A5A36">
    ARTISANAL CROCHET • EST. 2026
  </text>
</svg>
