<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#FAF5EE"/>
  
  <defs>
    <filter id="softShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2D1F18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Circular Instagram Border Guide -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#2D1F18" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(0, -10)" filter="url(#softShadow1)">
    <!-- Big Soft Yarn Heart -->
    <path d="M 250,290 C 210,240 160,200 160,155 C 160,115 195,90 235,105 C 243,108 247,114 250,118 C 253,114 257,108 265,105 C 305,90 340,115 340,155 C 340,200 290,240 250,290 Z" 
          fill="#F0C7BA" stroke="#2D1F18" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Heart Wool Stitch Lines -->
    <path d="M 185,140 Q 250,170 315,140" fill="none" stroke="#2D1F18" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 175,175 Q 250,205 325,175" fill="none" stroke="#2D1F18" stroke-width="4" stroke-linecap="round"/>
    <path d="M 190,210 Q 250,238 310,210" fill="none" stroke="#2D1F18" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 215,245 Q 250,265 285,245" fill="none" stroke="#2D1F18" stroke-width="3" stroke-linecap="round"/>

    <!-- Diagonal Cute Wooden Hook -->
    <path d="M 140,305 L 345,100" stroke="#9E693D" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 140,305 L 345,100" stroke="#2D1F18" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hook Tip -->
    <path d="M 338,92 Q 355,85 348,102" fill="none" stroke="#2D1F18" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Cute Thread Swirl -->
    <path d="M 345,95 C 385,80 395,145 330,150 C 270,155 220,100 170,170 C 130,225 150,300 210,305" 
          fill="none" stroke="#D96E58" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Sparkles -->
    <path d="M 145,120 Q 145,130 135,130 Q 145,130 145,140 Q 145,130 155,130 Q 145,130 145,120 Z" fill="#D96E58"/>
    <path d="M 355,240 Q 355,247 348,247 Q 355,247 355,254 Q 355,247 362,247 Q 355,247 355,240 Z" fill="#D96E58"/>
  </g>

  <!-- Typography -->
  <text x="250" y="390" text-anchor="middle" font-family="'Nunito', 'Quicksand', sans-serif" font-size="44" font-weight="900" letter-spacing="0.25em" fill="#2D1F18">
    cocoon
  </text>
  <text x="250" y="420" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" letter-spacing="0.35em" fill="#9E693D">
    HANDMADE CROCHET
  </text>
</svg>
