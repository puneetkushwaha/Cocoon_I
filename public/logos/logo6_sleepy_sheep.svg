<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Warm Oat Milk Background -->
  <rect width="500" height="500" fill="#F8F4EC"/>

  <!-- Subtle border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#2B2019" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.25"/>

  <!-- SLEEPY LAMB MASCOT -->
  <g transform="translate(0, -15)">
    <!-- Fluffy Body made of Wool Puffs -->
    <!-- Center Body -->
    <circle cx="250" cy="210" r="70" fill="#FFFFFF" stroke="#2B2019" stroke-width="4"/>
    
    <!-- Outer Wool Bumps -->
    <circle cx="190" cy="180" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="210" cy="140" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="250" cy="130" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="290" cy="140" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="310" cy="180" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="315" cy="225" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="295" cy="265" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="250" cy="275" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="205" cy="265" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="185" cy="225" r="24" fill="#FFFFFF" stroke="#2B2019" stroke-width="3.5"/>

    <!-- Re-fill center white to cover inner strokes -->
    <circle cx="250" cy="210" r="62" fill="#FFFFFF"/>

    <!-- Lamb Face -->
    <ellipse cx="250" cy="210" rx="36" ry="28" fill="#FCECE6" stroke="#2B2019" stroke-width="3.5"/>
    
    <!-- Sleepy Curved Eyes -->
    <path d="M 230,205 Q 238,215 246,205" fill="none" stroke="#2B2019" stroke-width="3" stroke-linecap="round"/>
    <path d="M 254,205 Q 262,215 270,205" fill="none" stroke="#2B2019" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Cute Pink Nose -->
    <path d="M 247,218 L 253,218 L 250,222 Z" fill="#E76F51"/>
    
    <!-- Blushing Pink Cheeks -->
    <circle cx="225" cy="216" r="6.5" fill="#FFC1BD" opacity="0.9"/>
    <circle cx="275" cy="216" r="6.5" fill="#FFC1BD" opacity="0.9"/>

    <!-- Droopy Cute Ears -->
    <ellipse cx="205" cy="200" rx="14" ry="8" fill="#FCECE6" stroke="#2B2019" stroke-width="3" transform="rotate(-25 205 200)"/>
    <ellipse cx="295" cy="200" rx="14" ry="8" fill="#FCECE6" stroke="#2B2019" stroke-width="3" transform="rotate(25 295 200)"/>

    <!-- Cute Knitted Beanie on Head -->
    <path d="M 226,145 Q 250,118 274,145 Z" fill="#E76F51" stroke="#2B2019" stroke-width="3.5"/>
    <circle cx="250" cy="116" r="7" fill="#F4A261" stroke="#2B2019" stroke-width="2.5"/>

    <!-- Cute Crochet Hook Held by Lamb -->
    <path d="M 175,260 L 325,260" stroke="#9E693D" stroke-width="6" stroke-linecap="round"/>
    <path d="M 175,260 L 325,260" stroke="#2B2019" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 320,255 Q 332,252 328,264" fill="none" stroke="#2B2019" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="250" y="395" text-anchor="middle" font-family="'Comfortaa', 'Quicksand', sans-serif" font-size="44" font-weight="900" letter-spacing="0.25em" fill="#2B2019">
    cocoon
  </text>
  <text x="250" y="425" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" letter-spacing="0.32em" fill="#E76F51">
    HANDMADE WITH LOVE 🧶
  </text>
</svg>
