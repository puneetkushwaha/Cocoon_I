<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Warm Linen Background -->
  <rect width="500" height="500" fill="#FAF6EE"/>

  <!-- Minimal Circle Guide -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#261E1A" stroke-width="1.2" opacity="0.2"/>

  <!-- DAISY & YARN LOOP -->
  <g transform="translate(0, -15)">
    <!-- Yarn Loop Base Circle -->
    <ellipse cx="250" cy="220" rx="90" ry="90" fill="none" stroke="#261E1A" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Overlapping Thread Tail -->
    <path d="M 230,308 C 210,320 180,310 180,290 C 180,265 210,250 250,250 C 290,250 320,280 320,305 C 320,330 280,340 260,330" 
          fill="none" stroke="#261E1A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Daisy Flower (Centered Inside Loop) -->
    <g transform="translate(250, 195)">
      <!-- 8 White Petals -->
      <g fill="#FFFFFF" stroke="#261E1A" stroke-width="3.5">
        <ellipse cx="0" cy="-42" rx="13" ry="24"/>
        <ellipse cx="30" cy="-30" rx="13" ry="24" transform="rotate(45 30 -30)"/>
        <ellipse cx="42" cy="0" rx="24" ry="13"/>
        <ellipse cx="30" cy="30" rx="13" ry="24" transform="rotate(-45 30 30)"/>
        <ellipse cx="0" cy="42" rx="13" ry="24"/>
        <ellipse cx="-30" cy="30" rx="13" ry="24" transform="rotate(45 -30 30)"/>
        <ellipse cx="-42" cy="0" rx="24" ry="13"/>
        <ellipse cx="-30" cy="-30" rx="13" ry="24" transform="rotate(-45 -30 -30)"/>
      </g>
      
      <!-- Sunny Gold Center -->
      <circle cx="0" cy="0" r="20" fill="#E9C46A" stroke="#261E1A" stroke-width="4"/>
      <!-- Soft Texture Dots -->
      <circle cx="-5" cy="-4" r="2.5" fill="#D4A343"/>
      <circle cx="5" cy="4" r="2.5" fill="#D4A343"/>
      <circle cx="3" cy="-5" r="2" fill="#D4A343"/>
    </g>

    <!-- Two Minimal Sage Leaves -->
    <path d="M 160,220 Q 140,200 150,185 Q 165,190 160,220 Z" fill="#7E9A85" stroke="#261E1A" stroke-width="2.5"/>
    <path d="M 340,220 Q 360,200 350,185 Q 335,190 340,220 Z" fill="#7E9A85" stroke="#261E1A" stroke-width="2.5"/>
  </g>

  <!-- Clean Minimalist Typography -->
  <text x="250" y="390" text-anchor="middle" font-family="'Nunito', 'Century Gothic', sans-serif" font-size="46" font-weight="900" letter-spacing="0.32em" fill="#261E1A">
    cocoon
  </text>
  <text x="250" y="420" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-size="10" font-weight="800" letter-spacing="0.38em" fill="#7E9A85">
    COTTAGECORE KNITS &amp; CROCHET
  </text>
</svg>
