<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Warm Earthy Sand Background -->
  <rect width="500" height="500" fill="#FAF6F0"/>

  <!-- Minimal Circle Frame -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#2B1D16" stroke-width="1.2" opacity="0.2"/>

  <!-- GENTLE HANDS HOLDING COCOON EMBLEM -->
  <g transform="translate(0, -15)">
    <!-- Soft Warm Cocoon Ball in Center -->
    <ellipse cx="250" cy="195" rx="55" ry="65" fill="#E6CCB2" stroke="#2B1D16" stroke-width="3.5"/>
    
    <!-- Cocoon Yarn Weave Lines -->
    <path d="M 205,170 Q 250,150 295,170" fill="none" stroke="#2B1D16" stroke-width="3" stroke-linecap="round"/>
    <path d="M 198,198 Q 250,175 302,198" fill="none" stroke="#2B1D16" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 205,225 Q 250,205 295,225" fill="none" stroke="#2B1D16" stroke-width="3" stroke-linecap="round"/>
    <path d="M 225,145 Q 260,195 240,245" fill="none" stroke="#7F5539" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Gentle Cup Hand -->
    <path d="M 155,270 
             C 175,275 210,270 235,260 
             C 240,258 245,250 240,245 
             C 230,245 200,250 175,245 
             C 160,240 145,250 155,270 
             Z" 
          fill="#DDB892" stroke="#2B1D16" stroke-width="3" stroke-linejoin="round"/>

    <!-- Right Gentle Cup Hand -->
    <path d="M 345,270 
             C 325,275 290,270 265,260 
             C 260,258 255,250 260,245 
             C 270,245 300,250 325,245 
             C 340,240 355,250 345,270 
             Z" 
          fill="#DDB892" stroke="#2B1D16" stroke-width="3" stroke-linejoin="round"/>

    <!-- Rising Cozy Serotonin Sparkles / Warm Steam -->
    <path d="M 240,115 Q 245,100 240,85" fill="none" stroke="#9C6644" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 255,125 Q 260,105 255,90" fill="none" stroke="#9C6644" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="230" cy="100" r="3" fill="#9C6644"/>
    <circle cx="270" cy="98" r="3" fill="#9C6644"/>
  </g>

  <!-- Warm Slow-Living Typography -->
  <text x="250" y="380" text-anchor="middle" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="48" font-weight="600" font-style="italic" letter-spacing="0.25em" fill="#2B1D16">
    Cocoon
  </text>
  <text x="250" y="410" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="0.45em" fill="#9C6644">
    SLOW LIVING • CROCHET • CRAFT
  </text>
</svg>
